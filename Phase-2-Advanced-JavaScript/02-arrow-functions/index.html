<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2><br/>
    First Number : <input type="number" name="a" id="a"><br/><br/>
    Second Number : <input type="number" name="b" id="b"><br/><br/>
    <button id="add">+</button>
    <button id="sub">-</button>
    <button id="mul">*</button>
    <button id="div">/</button>
    <br/><br/>
    <p id="result"></p>
    <script src="./simple_calcuator.js"></script>
</body>
</html>
